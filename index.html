<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#060817">
  <title>Claude Artifact Cabinet</title>
  <style>
    :root { color-scheme: dark; font-family: Georgia, serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #060817; color: #f4e7d2; }
    main { width: min(100% - 3rem, 36rem); }
    small { color: #8fe3ff; font: 0.75rem Consolas, monospace; letter-spacing: .16em; text-transform: uppercase; }
    h1 { font-size: clamp(2.5rem, 8vw, 4.5rem); font-weight: normal; line-height: 1; margin: 1rem 0 2rem; }
    a { display: block; margin-bottom: 1rem; padding: 1.25rem 1.5rem; border: 1px solid #ffb45466; border-radius: 1rem; color: #ffb454; text-decoration: none; font-size: 1.5rem; }
    a:hover, a:focus-visible { background: #ffb45418; outline-color: #ffb454; }
    a span { display: block; margin-top: .5rem; color: #f4e7d299; font: .8rem Consolas, monospace; }
  </style>
</head>
<body>
  <main>
    <small>One-off Claude artifacts</small>
    <h1>Artifact Cabinet</h1>
    <a href="./keep-a-light/">Keep a Light <span>A short interactive walk toward dawn</span></a>
    <a href="./dugout/">Dugout Playbook <span>Animated 8U defense plays to walk through with the team</span></a>
